<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b1f"/><stop offset="1" stop-color="#070611"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="0%" r="70%">
      <stop offset="0" stop-color="#8b5cff" stop-opacity="0.32"/><stop offset="1" stop-color="#8b5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cff"/><stop offset="0.5" stop-color="#29e0c8"/><stop offset="1" stop-color="#ff5fa2"/>
    </linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fe0a6" stop-opacity="0.18"/><stop offset="1" stop-color="#2fe0a6" stop-opacity="0.03"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="430" fill="url(#bg)"/>
  <rect width="1200" height="430" fill="url(#glow)"/>

  <!-- brand -->
  <circle cx="74" cy="78" r="26" fill="url(#logo)"/>
  <circle cx="74" cy="78" r="9" fill="#0d0b1f"/>
  <text x="116" y="72" fill="#e8e6f7" font-size="34" font-weight="800">PortalPilot</text>
  <text x="117" y="98" fill="#9b96bd" font-size="16">AI copilot &amp; command center for Portaldot</text>

  <!-- headline -->
  <text x="60" y="186" fill="#ffffff" font-size="40" font-weight="800">Talk to Portaldot in plain English.</text>
  <text x="60" y="232" fill="#cfc8ff" font-size="22">It explains, simulates with the real POT fee, and executes only after you confirm.</text>

  <!-- feature pills -->
  <g font-size="15" fill="#d6cfff">
    <rect x="60" y="266" width="232" height="38" rx="19" fill="rgba(139,92,255,0.12)" stroke="#8b5cff" stroke-opacity="0.4"/>
    <text x="80" y="290">✦ NL → on-chain action</text>
    <rect x="304" y="266" width="226" height="38" rx="19" fill="rgba(41,224,200,0.10)" stroke="#29e0c8" stroke-opacity="0.4"/>
    <text x="324" y="290">⛢ dry-run + POT fee</text>
    <rect x="542" y="266" width="210" height="38" rx="19" fill="rgba(255,95,162,0.10)" stroke="#ff5fa2" stroke-opacity="0.4"/>
    <text x="562" y="290">◉ built-in explorer</text>
  </g>

  <!-- faux receipt card -->
  <g transform="translate(792,150)">
    <rect width="348" height="150" rx="14" fill="rgba(47,224,166,0.10)" stroke="#2fe0a6" stroke-opacity="0.45"/>
    <text x="20" y="34" fill="#2fe0a6" font-size="16" font-weight="800">✓ Executed on-chain — POT gas paid</text>
    <g font-family="ui-monospace, Consolas, monospace" font-size="13">
      <text x="20" y="66" fill="#9b96bd">amount</text><text x="328" y="66" fill="#e8e6f7" text-anchor="end">1 POT → Bob</text>
      <text x="20" y="92" fill="#9b96bd">fee</text><text x="328" y="92" fill="#29e0c8" text-anchor="end">0.0147 POT</text>
      <text x="20" y="118" fill="#9b96bd">events</text><text x="328" y="118" fill="#29e0c8" text-anchor="end">balances.Transfer …</text>
    </g>
  </g>

  <text x="60" y="392" fill="#6f6a8f" font-size="14" font-family="ui-monospace, Consolas, monospace">Portaldot mini hackathon S1 · TypeScript · @polkadot/api · React · POT (14dp) · ss58 42</text>
</svg>
